<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <link rel="icon" href="img/flowers.png" type="image/x-icon">
    <title>FLORES</title>
    <style>
        .selector-color {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
        .selector-color label {
            color: #fff;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            opacity: 0.95;
        }
        .selector-color input[type="color"] {
            width: 42px;
            height: 42px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            padding: 0;
            outline: none;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .selector-color input[type="color"]:hover {
            transform: scale(1.1);
            border-color: #fff;
        }
        .selector-color input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        .selector-color input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        .mensaje-bonito {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            max-width: 90%;
            width: 640px;
            padding: 22px 34px;
            text-align: center;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(255, 255, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            animation: aparecer-mensaje 2s ease-out 1s backwards,
                       flotar-mensaje 4s ease-in-out 3s infinite;
        }
        .mensaje-bonito p {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-style: italic;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #ffffff;
            letter-spacing: 0.3px;
            text-shadow:
                0 0 10px rgba(255, 255, 255, 0.6),
                0 0 20px rgba(255, 255, 255, 0.35),
                0 0 40px rgba(255, 255, 255, 0.15);
        }
        .mensaje-bonito .corazon {
            display: inline-block;
            color: #ffb6c1;
            font-style: normal;
            animation: latir 1.4s ease-in-out infinite;
        }

        @keyframes aparecer-mensaje {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px) scale(0.9);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
                filter: blur(0);
            }
        }
        @keyframes flotar-mensaje {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-8px); }
        }
        @keyframes latir {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .cinamoroll {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 9998;
            width: 140px;
            height: auto;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.5))
                    drop-shadow(0 0 30px rgba(200, 230, 255, 0.35));
            will-change: transform;
            animation: aparecer-cinamoroll 2.5s ease-out 0.4s backwards,
                       flotar-cinamoroll 4s ease-in-out 3s infinite;
        }
        @keyframes aparecer-cinamoroll {
            0% {
                opacity: 0;
                transform: translateY(-40px) scale(0.5) rotate(-15deg);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
                filter: blur(0)
                        drop-shadow(0 0 15px rgba(255, 255, 255, 0.5))
                        drop-shadow(0 0 30px rgba(200, 230, 255, 0.35));
            }
        }
        @keyframes flotar-cinamoroll {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50%      { transform: translateY(-10px) rotate(3deg); }
        }

        @media (max-width: 768px) {
            .cinamoroll {
                width: 95px;
                top: 15px;
                right: 15px;
                filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.45));
            }
        }
        @media (max-width: 574px) {
            .mensaje-bonito {
                top: 25px;
                padding: 16px 20px;
                width: 92%;
            }
            .mensaje-bonito p {
                font-size: 0.9rem;
                line-height: 1.6;
            }
            .selector-color {
                bottom: 15px;
                right: 15px;
                padding: 10px 14px;
            }
            .cinamoroll {
                width: 75px;
                top: 10px;
                right: 10px;
            }
        }
    </style>

    <script>
    // ============================================================
    // CAMBIO DE COLOR EN TIEMPO REAL CON WATCHER
    // - Detecta el arrastre de la barra de tonos con requestAnimationFrame
    // - Aplica estilos directamente con !important para que ninguna
    //   animación los sobrescriba
    // ============================================================
    (function () {
        const input = document.getElementById('colorFlor');
        let ultimoColor = null;

        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            return {
                r: parseInt(hex.substring(0, 2), 16),
                g: parseInt(hex.substring(2, 4), 16),
                b: parseInt(hex.substring(4, 6), 16)
            };
        }

        function aclarar(hex, factor) {
            factor = factor === undefined ? 0.4 : factor;
            const { r, g, b } = hexToRgb(hex);
            const nr = Math.round(r + (255 - r) * factor);
            const ng = Math.round(g + (255 - g) * factor);
            const nb = Math.round(b + (255 - b) * factor);
            return 'rgb(' + nr + ', ' + ng + ', ' + nb + ')';
        }

        function aplicarColor(color) {
            if (color === ultimoColor) return;
            ultimoColor = color;

            const rgb = hexToRgb(color);
            const claro = aclarar(color, 0.4);
            const rgba06 = 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.6)';
            const rgba09 = 'rgba(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ', 0.9)';

            // 1) Variables CSS globales
            const raiz = document.documentElement;
            raiz.style.setProperty('--color-flor', color);
            raiz.style.setProperty('--color-flor-suave', claro);
            raiz.style.setProperty('--color-flor-rgba', rgba06);
            raiz.style.setProperty('--color-flor-rgba-fuerte', rgba09);

            // 2) PÉTALOS
            document.querySelectorAll('.flower__leaf').forEach(function (el) {
                el.style.setProperty('background-color', color, 'important');
                el.style.setProperty('background-image',
                    'linear-gradient(to top, ' + color + ', ' + claro + ')',
                    'important');
            });

            // 3) CÍRCULO CENTRAL
            document.querySelectorAll('.flower__white-circle').forEach(function (el) {
                el.style.setProperty('background-color', color, 'important');
                el.style.setProperty('box-shadow', '0 0 1vmin ' + rgba09, 'important');
            });

            // 4) LUCES FLOTANTES
            document.querySelectorAll('.flower__light').forEach(function (el) {
                el.style.setProperty('background-color', color, 'important');
                el.style.setProperty('box-shadow', '0 0 4px ' + color, 'important');
            });
        }

        // ---- Eventos estándar ----
        input.addEventListener('input', function (e) {
            aplicarColor(e.target.value);
        });
        input.addEventListener('change', function (e) {
            aplicarColor(e.target.value);
        });

        // ---- WATCHER: vigila el valor constantemente ----
        // Mientras el mouse esté encima del selector, revisa cada frame
        // si el valor cambió. Captura el arrastre de la barra de tonos
        // aunque el navegador no dispare 'input'.
        let watcherActivo = false;

        function vigilar() {
            if (!watcherActivo) return;
            if (input.value !== ultimoColor) {
                aplicarColor(input.value);
            }
            requestAnimationFrame(vigilar);
        }

        input.addEventListener('mouseenter', function () {
            watcherActivo = true;
            vigilar();
        });
        input.addEventListener('mouseleave', function () {
            watcherActivo = false;
        });

        // Para móviles: activar también con touch
        input.addEventListener('touchstart', function () {
            watcherActivo = true;
            vigilar();
        }, { passive: true });
        input.addEventListener('touchend', function () {
            watcherActivo = false;
        });

        // ---- Color inicial ----
        aplicarColor(input.value);
    })();
    </script>
